# Plantilla: la imagen oficial de nginx sustituye ${PORT} y ${BACKEND_URL}
# al arrancar (valores por defecto en el Dockerfile; en la nube los pone la plataforma).
# Connection "upgrade" solo cuando el cliente pide WebSocket; vacío en el resto.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta no encontrada devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # La API, el WebSocket y el stream SSE se redirigen al backend por la red privada.
  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # WebSocket (/api/ws): reenvía la petición de cambio de protocolo.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Sin buffering y con conexión larga (SSE y WebSocket)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Cacheo de assets con hash en el nombre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
