# Plantilla: la imagen oficial de nginx sustituye ${PORT} y ${BACKEND_URL}
# al arrancar (valores por defecto en el Dockerfile; en la nube los pone la plataforma).
server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta no encontrada devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # La API y el stream SSE se redirigen al backend por la red privada.
  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Server-Sent Events: sin buffering, conexión larga
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # Cacheo de assets con hash en el nombre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
